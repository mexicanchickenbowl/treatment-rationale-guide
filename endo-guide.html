<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endodontic Treatment Rationale Guide</title>
  <meta name="description" content="Living, source-backed endodontic treatment rationale guide with study and quiz views.">
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2428;
      --muted: #637079;
      --line: #d9e1e5;
      --panel: #ffffff;
      --page: #f4f7f6;
      --teal: #0f766e;
      --teal-soft: #e0f2f1;
      --amber: #a16207;
      --amber-soft: #fef3c7;
      --rose: #be123c;
      --rose-soft: #ffe4e6;
      --blue: #1d4ed8;
      --blue-soft: #dbeafe;
      --green: #166534;
      --green-soft: #dcfce7;
      --shadow: 0 16px 40px rgba(30, 36, 40, 0.08);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      letter-spacing: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 230px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border: 2px solid var(--teal);
      border-radius: 50% 50% 45% 45%;
      position: relative;
      background: linear-gradient(180deg, #fff 0%, #eefcf9 100%);
      flex: 0 0 auto;
    }

    .mark::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 22px;
      left: 14px;
      top: 7px;
      border-radius: 10px;
      background: var(--teal);
    }

    .mark::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 2px;
      left: 7px;
      top: 25px;
      background: #94a3b8;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 760;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
    }

    .mode-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      min-height: 40px;
    }

    .mode-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 14px;
      min-width: 86px;
    }

    .mode-switch button.active {
      background: var(--teal);
      color: #fff;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .home-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--teal);
      background: #fff;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .home-link:hover {
      background: var(--teal-soft);
    }

    main {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 250px minmax(320px, 520px) minmax(360px, 1fr);
      gap: 16px;
      padding: 16px 20px 28px;
    }

    aside,
    .list-panel,
    .detail-panel,
    .quiz-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    aside {
      padding: 14px;
      align-self: start;
      position: sticky;
      top: 86px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 760;
      text-transform: uppercase;
      color: var(--muted);
    }

    .domain-list {
      display: grid;
      gap: 8px;
    }

    .domain-button {
      width: 100%;
      min-height: 38px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      text-align: left;
    }

    .domain-button.active {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px;
      min-height: 64px;
    }

    .stat strong {
      display: block;
      font-size: 21px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .list-panel {
      overflow: hidden;
      align-self: start;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .list-head strong {
      font-size: 14px;
    }

    .sort-select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 6px 8px;
      color: var(--ink);
      max-width: 180px;
    }

    .card-list {
      display: grid;
      gap: 0;
      max-height: calc(100vh - 160px);
      overflow: auto;
    }

    .rationale-card {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      text-align: left;
      padding: 14px;
      display: grid;
      gap: 8px;
      min-height: 122px;
    }

    .rationale-card:hover,
    .rationale-card.active {
      background: #f8fbfa;
    }

    .rationale-card.active {
      box-shadow: inset 4px 0 0 var(--teal);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag.antibiotics {
      color: var(--rose);
      background: var(--rose-soft);
    }

    .tag.irrigation {
      color: var(--teal);
      background: var(--teal-soft);
    }

    .tag.vital-pulp-therapy {
      color: var(--green);
      background: var(--green-soft);
    }

    .tag.treatment-planning,
    .tag.imaging {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .card-id {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .rationale-card h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .preview {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail-panel,
    .quiz-panel {
      display: none;
      min-height: calc(100vh - 118px);
      overflow: hidden;
    }

    .detail-panel.active,
    .quiz-panel.active {
      display: block;
    }

    .detail-scroll,
    .quiz-scroll {
      max-height: calc(100vh - 118px);
      overflow: auto;
      padding: 18px;
    }

    .detail-header {
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .detail-header h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }

    .clinical-question {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    .bottom-line {
      border-left: 4px solid var(--teal);
      background: #f0fdfa;
      padding: 12px 14px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 0;
    }

    .quick-answer {
      border: 1px solid #99f6e4;
      background: #f0fdfa;
      border-radius: var(--radius);
      padding: 14px;
      margin: 0;
      font-size: 17px;
      line-height: 1.45;
    }

    .quick-answer strong {
      color: var(--teal);
    }

    .full-answer {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 0;
    }

    .full-answer summary {
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 10px 12px;
      color: var(--teal);
      font-weight: 700;
      cursor: pointer;
    }

    .full-answer .bottom-line {
      border-left: 0;
      border-top: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
      background: #f8fbfa;
    }

    .complexity-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--amber-soft);
      color: var(--amber);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .block {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .block h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .block p,
    .block li {
      color: #344149;
    }

    .block p {
      margin: 0;
    }

    .detail-disclosure {
      border-top: 1px solid var(--line);
      margin-top: 14px;
    }

    .detail-disclosure summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--teal);
      cursor: pointer;
      font-weight: 700;
      padding: 12px 0;
    }

    .detail-disclosure summary span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-disclosure-body {
      padding: 0 0 14px;
    }

    .detail-disclosure-body p {
      color: #344149;
      margin: 0;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li + li {
      margin-top: 6px;
    }

    .source-list {
      display: grid;
      gap: 8px;
    }

    .source-item {
      display: grid;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fff;
    }

    .source-item a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .source-item a:hover {
      text-decoration: underline;
    }

    .source-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .quiz-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      background: #fff;
      min-height: 360px;
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .quiz-card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .quiz-prompt {
      font-size: 18px;
      line-height: 1.4;
      margin: 0;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      min-height: 42px;
      text-align: left;
      padding: 10px 12px;
      color: var(--ink);
    }

    .choice.selected {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .answer {
      display: none;
      border-left: 4px solid var(--green);
      background: var(--green-soft);
      padding: 12px;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .answer.visible {
      display: block;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .primary,
    .secondary,
    .danger {
      border: 1px solid transparent;
      border-radius: var(--radius);
      min-height: 40px;
      padding: 9px 12px;
      font-weight: 700;
    }

    .primary {
      background: var(--teal);
      color: #fff;
    }

    .secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }

    .danger {
      background: var(--rose-soft);
      color: var(--rose);
      border-color: #fecdd3;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1120px) {
      main {
        grid-template-columns: 220px minmax(320px, 1fr);
      }

      .detail-panel,
      .quiz-panel {
        grid-column: 1 / -1;
        min-height: auto;
      }

      .detail-scroll,
      .quiz-scroll,
      .card-list {
        max-height: none;
      }

      aside {
        position: static;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .brand {
        min-width: 0;
      }

      main {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .mode-switch {
        width: 100%;
      }

      .top-actions {
        width: 100%;
        justify-content: stretch;
      }

      .home-link {
        flex: 0 0 auto;
      }

      .mode-switch button {
        flex: 1;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-panel,
      .quiz-panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="topbar">
        <div class="brand" aria-label="Endodontic Treatment Rationale Guide">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <h1>Endodontic Treatment Rationale Guide</h1>
            <div id="siteMeta" class="meta">Live guide</div>
          </div>
        </div>
        <label class="search">
          <span class="hidden">Search</span>
          <input id="searchInput" type="search" placeholder="Search rationales, board traps, sources">
        </label>
        <div class="top-actions">
          <a class="home-link" href="/">Apps</a>
          <nav class="mode-switch" aria-label="Mode">
            <button id="studyMode" class="active" type="button">Study</button>
            <button id="quizMode" type="button">Quiz</button>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <aside>
        <h2 class="section-title">Domains</h2>
        <div id="domainList" class="domain-list"></div>
        <div class="stat-grid">
          <div class="stat">
            <strong id="cardCount">0</strong>
            <span>Rationales</span>
          </div>
          <div class="stat">
            <strong id="quizCount">0</strong>
            <span>Quiz cards</span>
          </div>
          <div class="stat">
            <strong id="knownCount">0</strong>
            <span>Known</span>
          </div>
          <div class="stat">
            <strong id="reviewCount">0</strong>
            <span>Review</span>
          </div>
        </div>
      </aside>

      <section class="list-panel" aria-label="Rationale list">
        <div class="list-head">
          <strong id="resultLabel">Decision Points</strong>
          <select id="sortSelect" class="sort-select" aria-label="Sort decision points">
            <option value="domain">Domain</option>
            <option value="id">ID</option>
            <option value="title">Title</option>
          </select>
        </div>
        <div id="cardList" class="card-list"></div>
      </section>

      <section id="detailPanel" class="detail-panel active" aria-label="Selected rationale">
        <div id="detail" class="detail-scroll"></div>
      </section>

      <section id="quizPanel" class="quiz-panel" aria-label="Quiz">
        <div class="quiz-scroll">
          <div class="quiz-card">
            <div class="card-top">
              <span id="quizTag" class="tag">Quiz</span>
              <span id="quizProgress" class="card-id"></span>
            </div>
            <h2 id="quizTitle"></h2>
            <p id="quizPrompt" class="quiz-prompt"></p>
            <div id="quizChoices" class="choices"></div>
            <div id="quizAnswer" class="answer"></div>
            <div class="actions">
              <button id="revealAnswer" class="primary" type="button">Reveal Answer</button>
              <button id="markKnown" class="secondary" type="button">Known</button>
              <button id="markReview" class="danger" type="button">Needs Review</button>
              <button id="nextQuestion" class="secondary" type="button">Next</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="data/app-data.js?v=2026-07-01-b5"></script>
  <script>
    const data = window.ENDO_GUIDE_DATA || { rationales: [], sources: [] };
    const rationales = asArray(data.rationales);
    const sources = asArray(data.sources);
    const sourceMap = new Map(sources.map((source) => [source.id, source]));
    const storageKey = "endo-rationale-review-v1";

    const state = {
      query: "",
      domain: "All",
      selectedId: rationales[0]?.id || "",
      mode: "study",
      quizIndex: 0,
      sort: "domain",
      selectedChoice: "",
      review: loadReview()
    };

    const els = {
      searchInput: document.getElementById("searchInput"),
      siteMeta: document.getElementById("siteMeta"),
      studyMode: document.getElementById("studyMode"),
      quizMode: document.getElementById("quizMode"),
      domainList: document.getElementById("domainList"),
      cardCount: document.getElementById("cardCount"),
      quizCount: document.getElementById("quizCount"),
      knownCount: document.getElementById("knownCount"),
      reviewCount: document.getElementById("reviewCount"),
      resultLabel: document.getElementById("resultLabel"),
      sortSelect: document.getElementById("sortSelect"),
      cardList: document.getElementById("cardList"),
      detailPanel: document.getElementById("detailPanel"),
      quizPanel: document.getElementById("quizPanel"),
      detail: document.getElementById("detail"),
      quizTag: document.getElementById("quizTag"),
      quizProgress: document.getElementById("quizProgress"),
      quizTitle: document.getElementById("quizTitle"),
      quizPrompt: document.getElementById("quizPrompt"),
      quizChoices: document.getElementById("quizChoices"),
      quizAnswer: document.getElementById("quizAnswer"),
      revealAnswer: document.getElementById("revealAnswer"),
      markKnown: document.getElementById("markKnown"),
      markReview: document.getElementById("markReview"),
      nextQuestion: document.getElementById("nextQuestion")
    };

    function loadReview() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch (error) {
        return {};
      }
    }

    function saveReview() {
      localStorage.setItem(storageKey, JSON.stringify(state.review));
    }

    function slug(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }

    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function safeUrl(value) {
      const url = String(value || "");
      return /^https?:\/\//i.test(url) ? url : "#";
    }

    function firstSentence(text) {
      const value = String(text || "").replace(/\s+/g, " ").trim();
      if (!value) return "";
      const match = value.match(/^(.+?[.!?])\s/);
      return match ? match[1] : value;
    }

    function shortText(text, limit = 180) {
      const value = String(text || "").replace(/\s+/g, " ").trim();
      if (value.length <= limit) return value;
      const clipped = value.slice(0, limit);
      const boundary = Math.max(clipped.lastIndexOf(". "), clipped.lastIndexOf("; "), clipped.lastIndexOf(", "));
      return `${clipped.slice(0, boundary > 80 ? boundary + 1 : limit).trim()}...`;
    }

    function quickAnswer(entry) {
      if (entry.quick_answer) return shortText(entry.quick_answer, 280);
      const sentence = firstSentence(entry.bottom_line);
      return shortText(sentence || entry.bottom_line, 190);
    }

    function textOf(entry) {
      return [
        entry.id,
        entry.domain,
        entry.decision_point,
        entry.clinical_question,
        entry.bottom_line,
        entry.quick_answer,
        entry.board_frame,
        asArray(entry.rationale).join(" "),
        asArray(entry.pitfalls).join(" "),
        asArray(entry.source_ids).join(" "),
        asArray(entry.source_ids).map((id) => {
          const source = sourceMap.get(id);
          return source ? `${source.title} ${source.organization} ${source.type} ${source.use_for}` : "";
        }).join(" ")
      ].join(" ").toLowerCase();
    }

    function filteredRationales() {
      const query = state.query.trim().toLowerCase();
      let entries = rationales.filter((entry) => {
        const domainMatch = state.domain === "All" || entry.domain === state.domain;
        const queryMatch = !query || textOf(entry).includes(query);
        return domainMatch && queryMatch;
      });

      entries = entries.slice().sort((a, b) => {
        if (state.sort === "title") return a.decision_point.localeCompare(b.decision_point);
        if (state.sort === "id") return a.id.localeCompare(b.id);
        return a.domain.localeCompare(b.domain) || a.id.localeCompare(b.id);
      });

      return entries;
    }

    function quizCards() {
      return rationales.flatMap((entry) =>
        asArray(entry.quiz).map((card, index) => ({
          ...card,
          rationaleId: entry.id,
          domain: entry.domain,
          title: entry.decision_point,
          quizId: `${entry.id}-Q${String(index + 1).padStart(2, "0")}`
        }))
      );
    }

    function renderDomains() {
      const domains = ["All", ...Array.from(new Set(rationales.map((entry) => entry.domain))).sort()];
      els.domainList.innerHTML = domains.map((domain) => {
        const count = domain === "All" ? rationales.length : rationales.filter((entry) => entry.domain === domain).length;
        const active = domain === state.domain ? " active" : "";
        return `<button type="button" class="domain-button${active}" data-domain="${escapeAttr(domain)}">
          <span>${escapeHtml(domain)}</span><span class="count">${count}</span>
        </button>`;
      }).join("");

      els.domainList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.domain = button.dataset.domain;
          const entries = filteredRationales();
          state.selectedId = entries[0]?.id || rationales[0]?.id || "";
          render();
        });
      });
    }

    function renderStats() {
      const cards = quizCards();
      const known = Object.values(state.review).filter((value) => value === "known").length;
      const review = Object.values(state.review).filter((value) => value === "review").length;
      els.siteMeta.textContent = `Updated Jun 30, 2026 - ${rationales.length} decision points - ${sources.length} sources - ${cards.length} quiz cards`;
      els.cardCount.textContent = String(rationales.length);
      els.quizCount.textContent = String(cards.length);
      els.knownCount.textContent = String(known);
      els.reviewCount.textContent = String(review);
    }

    function renderList() {
      const entries = filteredRationales();
      els.resultLabel.textContent = `${entries.length} Decision Point${entries.length === 1 ? "" : "s"}`;

      if (!entries.length) {
        els.cardList.innerHTML = `<div class="empty">No matches.</div>`;
        return;
      }

      if (!entries.some((entry) => entry.id === state.selectedId)) {
        state.selectedId = entries[0].id;
      }

      els.cardList.innerHTML = entries.map((entry) => {
        const active = entry.id === state.selectedId ? " active" : "";
        const tagClass = slug(entry.domain);
        return `<button type="button" class="rationale-card${active}" data-id="${escapeAttr(entry.id)}">
          <div class="card-top">
            <span class="tag ${tagClass}">${escapeHtml(entry.domain)}</span>
            <span class="card-id">${escapeHtml(entry.id)}</span>
          </div>
          <h2>${escapeHtml(entry.decision_point)}</h2>
          <p class="preview">${escapeHtml(quickAnswer(entry))}</p>
        </button>`;
      }).join("");

      els.cardList.querySelectorAll(".rationale-card").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.id;
          state.mode = "study";
          render();
        });
      });
    }

    function listBlock(title, items) {
      if (!items || !items.length) return "";
      return `<div class="block"><h3>${escapeHtml(title)}</h3><ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div>`;
    }

    function renderDetail() {
      const entry = rationales.find((item) => item.id === state.selectedId) || rationales[0];
      if (!entry) {
        els.detail.innerHTML = `<div class="empty">No rationale selected.</div>`;
        return;
      }

      const sourceHtml = asArray(entry.source_ids).map((id) => {
        const source = sourceMap.get(id);
        if (!source) return "";
        const citation = source.inline_citation ? `<span>Citation: (${escapeHtml(source.inline_citation)})</span>` : "";
        return `<div class="source-item">
          <a href="${escapeAttr(safeUrl(source.url))}" target="_blank" rel="noreferrer">${escapeHtml(source.id)}: ${escapeHtml(source.title)}</a>
          <span>${escapeHtml(source.organization)} - ${escapeHtml(source.type)}</span>
          ${citation}
          <span>${escapeHtml(source.use_for)}</span>
        </div>`;
      }).join("");
      const bottomWords = String(entry.bottom_line || "").trim().split(/\s+/).filter(Boolean).length;
      const complexityChip = bottomWords > 80 ? `<span class="complexity-chip">Long answer</span>` : "";
      const sourceCount = asArray(entry.source_ids).length;

      els.detail.innerHTML = `
        <div class="detail-header">
          <div class="card-top">
            <span class="tag ${slug(entry.domain)}">${escapeHtml(entry.domain)}</span>
            <span class="card-id">${escapeHtml(entry.id)}</span>
          </div>
          <h2>${escapeHtml(entry.decision_point)}</h2>
          <p class="clinical-question">${escapeHtml(entry.clinical_question)}</p>
          <p class="quick-answer"><strong>Quick answer:</strong> ${escapeHtml(quickAnswer(entry))}</p>
          <details class="full-answer">
            <summary>Full detail ${complexityChip}</summary>
            <p class="bottom-line">${escapeHtml(entry.bottom_line)}</p>
          </details>
        </div>
        <div class="detail-grid">
          ${listBlock("Why", entry.rationale)}
          ${listBlock("Use When", entry.use_when)}
          ${listBlock("Avoid When", entry.avoid_when)}
          ${listBlock("Pitfalls", entry.pitfalls)}
        </div>
        <div class="block">
          <h3>Board Frame</h3>
          <p>${escapeHtml(entry.board_frame)}</p>
        </div>
        ${listBlock("Numbers To Know", entry.numbers_to_know)}
        <details class="detail-disclosure">
          <summary>Evidence notes <span>Supporting detail</span></summary>
          <div class="detail-disclosure-body">
            <p>${escapeHtml(entry.evidence_notes)}</p>
          </div>
        </details>
        <details class="detail-disclosure">
          <summary>Sources <span>${sourceCount} source${sourceCount === 1 ? "" : "s"}</span></summary>
          <div class="detail-disclosure-body source-list">${sourceHtml}</div>
        </details>
      `;
    }

    function renderMode() {
      const quiz = state.mode === "quiz";
      els.studyMode.classList.toggle("active", !quiz);
      els.quizMode.classList.toggle("active", quiz);
      els.detailPanel.classList.toggle("active", !quiz);
      els.quizPanel.classList.toggle("active", quiz);
    }

    function renderQuiz() {
      const cards = quizCards();
      if (!cards.length) return;
      if (state.quizIndex >= cards.length) state.quizIndex = 0;
      const card = cards[state.quizIndex];
      els.quizTag.textContent = card.domain;
      els.quizTag.className = `tag ${slug(card.domain)}`;
      els.quizProgress.textContent = `${card.quizId} - ${state.quizIndex + 1} / ${cards.length}`;
      els.quizTitle.textContent = card.title;
      els.quizPrompt.textContent = card.prompt;
      els.quizAnswer.textContent = card.answer;
      els.quizAnswer.classList.remove("visible");
      state.selectedChoice = "";

      if (card.type === "multiple_choice") {
        els.quizChoices.innerHTML = asArray(card.choices).map((choice) =>
          `<button type="button" class="choice" data-choice="${escapeAttr(choice)}">${escapeHtml(choice)}</button>`
        ).join("");
        els.quizChoices.querySelectorAll(".choice").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedChoice = button.dataset.choice;
            els.quizChoices.querySelectorAll(".choice").forEach((choiceButton) => {
              choiceButton.classList.toggle("selected", choiceButton === button);
            });
          });
        });
      } else {
        els.quizChoices.innerHTML = "";
      }
    }

    function render() {
      renderDomains();
      renderStats();
      renderList();
      renderDetail();
      renderMode();
      renderQuiz();
    }

    els.searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      renderList();
      renderDetail();
    });

    els.sortSelect.addEventListener("change", (event) => {
      state.sort = event.target.value;
      renderList();
    });

    els.studyMode.addEventListener("click", () => {
      state.mode = "study";
      renderMode();
    });

    els.quizMode.addEventListener("click", () => {
      state.mode = "quiz";
      renderMode();
      renderQuiz();
    });

    els.revealAnswer.addEventListener("click", () => {
      els.quizAnswer.classList.add("visible");
    });

    els.nextQuestion.addEventListener("click", () => {
      const cards = quizCards();
      state.quizIndex = (state.quizIndex + 1) % cards.length;
      renderQuiz();
    });

    els.markKnown.addEventListener("click", () => {
      const card = quizCards()[state.quizIndex];
      state.review[card.quizId] = "known";
      saveReview();
      renderStats();
    });

    els.markReview.addEventListener("click", () => {
      const card = quizCards()[state.quizIndex];
      state.review[card.quizId] = "review";
      saveReview();
      renderStats();
    });

    render();
  </script>
</body>
</html>
